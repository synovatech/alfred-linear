# Publishes `Review Gate` as a commit status, not a check run. A status with
# the same context replaces the previous one, so the latest evaluation wins; a
# failed check run stays on its commit and, being required, kept blocking merges
# after the cause was fixed. The job below is deliberately not named
# `Review Gate`, or GitHub would require its check run as well.
#
# State, evaluated for the PR head commit:
#   failure  only when a `Vercel...` status failed or errored.
#   pending  until Autoreview (synova-autoreview[bot]) has reviewed any commit
#            on the PR and, in repos that deploy to Vercel, every `Vercel...`
#            status has succeeded. Any commit, not the head: Autoreview reviews
#            on demand rather than on every push.
#   success  otherwise, after a 30-second settle in Vercel repos so slower
#            projects can post their status first.
# A repo counts as deploying to Vercel if the default branch head or this commit
# has a `Vercel...` status.
#
# Triggers: `status` (not `deployment_status`) because Vercel posts statuses in
# every repo but GitHub Deployments only in some. Statuses posted with
# GITHUB_TOKEN don't trigger workflows, so publishing ours can't loop. Runs are
# serialized per commit (cancel-in-progress is false) so a stale evaluation
# can't overwrite a newer one. `status` and `deployment_status` events run the
# copy of this file on the default branch.
#
# Fail safe: if evaluation crashes, a best-effort `pending` is posted;
# otherwise the previous status stays.
#
# Not filtered by base branch: the ruleset targets each repo's default branch,
# which isn't always main. The same file works unchanged in every Synova repo.
#
# Known limitation: the status is stored per commit, but the review rule is per
# PR. If two open PRs share a head commit, the last evaluation decides the
# status for both, so a PR that was never reviewed can show success because
# another PR on that commit was. Accepted: it is rare, and the ruleset still
# requires an approving review from a person.
name: Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  # Vercel statuses (filtered by the job's `if`); not our own, see above.
  status:

permissions:
  statuses: write
  pull-requests: read

defaults:
  run:
    # Explicit bash adds pipefail to the default -e.
    shell: bash

jobs:
  # Not named `Review Gate`: a check run with that name would be required too.
  evaluate:
    name: Review Gate (evaluate)
    if: github.event_name != 'status' || startsWith(github.event.context, 'Vercel')
    # Per commit, queued rather than cancelled, so the last run to finish is the
    # last to post.
    concurrency:
      group: review-gate-${{ github.event.pull_request.head.sha || github.event.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha || github.event.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Find the PR
        id: pr
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Fail safe, as in the next step: a failed lookup mustn't leave an earlier success standing.
          fail_safe() {
            local code=$? description="Review Gate couldn't evaluate; re-run this job"
            if [ "$code" -ne 0 ] && gh api "repos/$REPO/statuses/$SHA" -f state=pending \
              -f context='Review Gate' -f description="$description" -f target_url="$RUN_URL" > /dev/null; then
              echo "Review Gate: pending ($description)"
            fi
            exit "$code"
          }
          trap fail_safe EXIT

          if [ -z "$PR" ]; then
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open" and .head.sha == env.SHA)][0].number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "No open PR has $SHA as its head; nothing to gate."
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Evaluate and post the status
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          posted=
          post() {
            local state=$1 description=${2:0:140}
            gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='Review Gate' \
              -f description="$description" -f target_url="$RUN_URL" > /dev/null || return 1
            posted=1
            echo "Review Gate: $state ($description)"
          }
          # Fail safe: never leave an earlier success standing after a crash.
          trap 'code=$?; if [ "$code" -ne 0 ] && [ -z "$posted" ]; then post pending "Review Gate couldn'"'"'t evaluate; re-run this job" || true; fi; exit "$code"' EXIT

          # Sorted "context=state" list of the Vercel statuses on a ref.
          vercel_statuses() {
            gh api "repos/$REPO/commits/$1/status" \
              --jq '[.statuses[] | select(.context | startswith("Vercel")) | "\(.context)=\(.state)"] | sort | join(",")'
          }
          has_failure() {
            case ",$1," in *=failure,*|*=error,*) return 0 ;; esac
            return 1
          }

          vercel=$(vercel_statuses "$SHA")
          if has_failure "$vercel"; then
            post failure "Vercel deployment failed: $vercel"
            exit 0
          fi

          # One line per Autoreview review across all pages; --jq runs per page.
          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "synova-autoreview[bot]") | .id' | wc -l)

          # A repo deploys to Vercel if this commit or the default branch's head has a Vercel status.
          deploys=
          if [ -n "$vercel" ]; then
            deploys=1
            echo "This repo deploys to Vercel; checked the Vercel statuses on $SHA: $vercel"
          else
            on_default=$(vercel_statuses "$DEFAULT_BRANCH")
            if [ -n "$on_default" ]; then
              deploys=1
              echo "This repo deploys to Vercel; checked the Vercel statuses on $DEFAULT_BRANCH: $on_default"
            else
              echo "This repo doesn't deploy to Vercel."
            fi
          fi

          waiting=
          hint=
          if [ "$reviews" -eq 0 ]; then
            waiting="Autoreview"
            hint="Add the Autoreview label to its Linear ticket."
          fi
          if [ -n "$deploys" ]; then
            case ",$vercel," in
              ,,|*=pending,*) waiting="${waiting:+$waiting, }Vercel deployment" ;;
            esac
          fi
          if [ -n "$waiting" ]; then
            post pending "Waiting for: $waiting${hint:+. $hint}"
            exit 0
          fi

          if [ -n "$deploys" ]; then
            # Give slower Vercel projects time to post, then require the same set.
            sleep 30
            settled=$(vercel_statuses "$SHA")
            if has_failure "$settled"; then
              post failure "Vercel deployment failed: $settled"
              exit 0
            fi
            if [ "$settled" != "$vercel" ]; then
              post pending "Waiting for the Vercel statuses to settle"
              exit 0
            fi
            post success "Autoreview has reviewed; Vercel deployed"
          else
            post success "Autoreview has reviewed; no Vercel deployment in this repo"
          fi
